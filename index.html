.hero .scrim{position:absolute;left:0;right:0;top:0;height:64%;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.55) 55%,rgba(255,255,255,0))}
.hero .title{position:absolute;left:16px;top:14px;font-size:17px;font-weight:800;
  color:#7a5a52;text-shadow:0 1px 0 #fff}
.hero .chip{position:absolute;left:16px;bottom:12px;background:rgba(255,255,255,.86);
  border-radius:99px;padding:5px 11px;font-size:11px;color:#7a6a60;border:1px solid #f3e3d5}

/* ===== 卡片 ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px;margin-bottom:12px;
  box-shadow:0 8px 20px rgba(140,120,110,.09)}
.card h2{margin:0 0 10px;font-size:15px;color:#6b5b6f}
.hint{font-size:11.5px;color:var(--ink2);line-height:1.6}

/* 任務卡 */
.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1px solid var(--line);
  background:var(--cream);margin-bottom:9px;cursor:pointer;transition:.15s}
.task:active{transform:scale(.985)}
.task .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.ico.a{background:var(--pink)}.ico.b{background:var(--lemon)}.ico.c{background:var(--mint)}
.ico.d{background:#ffe3e3}
.task .t{flex:1}
.task .t b{display:block;font-size:15px}
.task .t span{font-size:11.5px;color:var(--ink2)}
.ring{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:10.5px;color:#7b6a7f;background:conic-gradient(#ffd0e2 var(--p,0%),#f4efee 0)}
.ring i{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal}

/* 統計 */
.stats{display:flex;gap:9px}
.stats>div{flex:1;background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stats b{display:block;font-size:19px;color:#5c4a6b}
.stats span{font-size:11px;color:var(--ink2)}

/* 清單（仿看板） */
.list .row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed #f0e6dc}
.list .row:last-child{border-bottom:none}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--cream2)}
.list .row b{font-size:13.5px;font-weight:600}
.list .row small{display:block;font-size:11px;color:var(--ink2)}
.tag{margin-left:auto;font-size:10.5px;padding:3px 9px;border-radius:99px;background:#eafaf2;color:#3d9a72}
.tag.warn{background:#fff2e6;color:#b7773c}

/* 按鈕 */
.btn{width:100%;border:none;border-radius:18px;padding:14px;font-size:16px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,#ffb0c8,#ffcf9e);cursor:pointer;box-shadow:0 5px 0 #f6b3c6;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #f6b3c6}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line);box-shadow:0 4px 0 #f0e6dc}
.input{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:13px;font-size:20px;
  text-align:center;letter-spacing:8px;background:var(--cream)}

/* 答題 */
.hud{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin:0 2px 7px}
.bar{height:8px;background:#f1eae3;border-radius:99px;overflow:hidden;margin-bottom:10px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc3d6,#a8dcc6);transition:.3s}
.q{font-size:19.5px;line-height:1.6;font-weight:700;margin:2px 0 12px}
.choice{background:#fff;border:1.5px solid #efe4da;border-radius:16px;padding:13px 15px;font-size:16px;
  cursor:pointer;margin-bottom:8px}
.choice.ok{background:#e9fbf3;border-color:var(--ok);color:#1f7a5c}
.choice.bad{background:#fff0f3;border-color:var(--bad);color:#a83247}
.fb{border-radius:16px;padding:11px 13px;font-size:14px;line-height:1.6;margin-top:6px}
.fb.ok{background:#e9fbf3}.fb.bad{background:#fff0f3}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:#4a3f55;
  color:#fff;padding:10px 17px;border-radius:99px;font-size:13.5px;opacity:0;transition:.25s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
.center{text-align:center}
.big{font-size:42px;margin:4px 0}
.stars{font-size:15px;letter-spacing:2px}
.medals{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.medal{display:flex;align-items:center;gap:5px;background:var(--cream);border:1px solid var(--line);
  border-radius:99px;padding:5px 10px;font-size:11.5px;color:#6b5b6f}
.medal.lock{opacity:.42}
.streak{background:#fff2e6;color:#b7773c;border-radius:99px;padding:3px 9px;font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="mascot">🐣</span>
    <h1>詞語遊樂場</h1>
    <span class="sub">小五中文・Term 1</span>
  </div>

  <!-- 入口 -->
  <section id="gate">
    <div class="hero">
      <div class="scrim"></div>
      <div class="title">今日練幾題？</div>
      <div class="chip">🔑 先輸入你的課堂密碼</div>
    </div>
    <div class="card center">
      <h2>輸入你的密碼</h2>
      <input class="input" id="code" inputmode="numeric" maxlength="6" placeholder="••••">
      <p class="hint" style="margin:8px 0 0">密碼由老師分派，一人一組。</p>
      <button class="btn" id="enterBtn">入去玩 →</button>
      <p class="hint" id="gateMsg" style="margin:8px 0 0"></p>
    </div>
  </section>

  <!-- 主頁 -->
  <section id="home" class="hide">
    <div class="hero">
      <div class="scrim"></div>
      <div class="title" id="heroTitle">今日任務</div>
      <div class="chip" id="heroChip">⭐ 0 粒星</div>
    </div>

    <div class="card">
      <h2>揀一區嚟練</h2>
      <div class="task" data-mode="vocab">
        <div class="ico a">🔤</div>
        <div class="t"><b>詞語練習</b><span id="cVocab"></span></div>
        <div class="ring" id="rVocab"><i>0%</i></div>
      </div>
      <div class="task" data-mode="idiom">
        <div class="ico b">🧩</div>
        <div class="t"><b>成語練習</b><span id="cIdiom"></span></div>
        <div class="ring" id="rIdiom"><i>0%</i></div>
      </div>
      <div class="task" data-mode="char">
        <div class="ico c">✍️</div>
        <div class="t"><b>字辨練習</b><span id="cChar"></span></div>
        <div class="ring" id="rChar"><i>0%</i></div>
      </div>
      <div class="task" data-mode="wrong">
        <div class="ico d">📕</div>
        <div class="t"><b>錯題重練</b><span>再練答錯過的題目</span></div>
        <div class="ring" id="rWrong"><i>0%</i></div>
      </div>
    </div>

    <div class="card">
      <h2>我的記錄</h2>
      <div class="stats">
        <div><b id="sStars">0</b><span>星星</span></div>
        <div><b id="sDone">0</b><span>做過題目</span></div>
        <div><b id="sAcc">—</b><span>答對率</span></div>
      </div>
      <div class="list" id="recent" style="margin-top:8px"></div>
      <div style="margin-top:12px">
        <div class="hint" style="margin-bottom:4px">連勝獎章（連續答對）</div>
        <div class="medals" id="medals"></div>
      </div>
    </div>

    <button class="btn ghost" id="logout">離開（換人）</button>
  </section>

  $("cVocab").textContent = "詞語解釋、配對（共 " + BANK.vocab.length + " 題）";
  $("cIdiom").textContent = "成語意思（共 " + BANK.idiom.length + " 題）";
  $("cChar").textContent = "形近字、錯別字（共 " + BANK.char.length + " 題）";
  const map = {vocab:["rVocab","詞語"], idiom:["rIdiom","成語"], char:["rChar","字辨"], wrong:["rWrong","錯題"]};
  for(const k in map){
    const [id, label] = map[k];
    let p;
    if(k === "wrong"){ p = d.wrong.length ? 100 : 0; }
    else { const n = (d.log||[]).filter(x=>x.mode===k).length; p = Math.min(100, n*20); }
    const el = $(id);
    el.style.setProperty("--p", p + "%");
    el.querySelector("i").textContent = k === "wrong" ? (d.wrong.length ? d.wrong.length : 0) : p + "%";
  }
  const ms = d.medals || [];
  $("medals").innerHTML = MEDALS.map(m =>
    `<span class="medal ${ms.includes(m.key) ? '' : 'lock'}">${m.emoji} ${m.name}　${m.need} 連勝</span>`
  ).join("") + `<span class="medal">🔥 最長 ${d.best || 0} 連勝</span>`;
  const rec = (d.log||[]).slice(-3).reverse();
  $("recent").innerHTML = rec.length
    ? rec.map(r=>`<div class="row"><div class="av">${r.emoji}</div><div><b>${r.label}</b>
        <small>${r.date}　答對 ${r.right}/${r.total}</small></div>
        <span class="tag ${r.right===r.total?'':'warn'}">${r.right===r.total?'全對':'再練'}</span></div>`).join("")
    : `<div class="row"><div class="av">🌱</div><div><b>仲未有記錄</b><small>揀一區開始玩啦</small></div></div>`;
}
$("logout").onclick = () => { S.cur = null; save(); show("gate"); };

const MEDALS = [
  {need: 3,  key: "bronze", emoji: "🥉", name: "銅章" },
  {need: 5,  key: "silver", emoji: "🥈", name: "銀章" },
  {need: 8,  key: "gold",   emoji: "🥇", name: "金章" },
  {need: 12, key: "ruby",   emoji: "🏅", name: "連勝王" },
  {need: 20, key: "crown",  emoji: "👑", name: "不敗傳說" }
];
const LABEL = {vocab:"詞語練習", idiom:"成語練習", char:"字辨練習", wrong:"錯題重練"};
const EMOJI = {vocab:"🔤", idiom:"🧩", char:"✍️", wrong:"📕"};
let list=[], idx=0, right=0, mode="vocab", streak=0, newMedal=null;
function start(m){
  mode = m; const d = u();
  if(m === "wrong"){
    list = d.wrong.slice();
    if(!list.length){ toast("暫時未有錯題，好叻！"); return; }
  } else {
    list = pick(m, ROUND[m]);
  }
  idx = 0; right = 0; streak = 0; $("streak").textContent = "🔥 0"; show("quiz"); render();
}

function pick(mode, n){
  const all = BANK[mode].slice();
  const MIX = {vocab: {cloze: 15, def: 5}, idiom: {cloze: 10, mean: 10}};
  const mix = MIX[mode];
  if(!mix){ shuffle(all); return all.slice(0, n); }
  const group = k => (k === "w2m" || k === "m2w") ? "def" : k;
  const buckets = {};
  all.forEach(x => { const g = group(x.kind); (buckets[g] = buckets[g] || []).push(x); });
  Object.values(buckets).forEach(shuffle);
  const out = [], keys = Object.keys(mix);
  // 逐輪交替抽：填充、解釋、填充……唔會一堆同類
  while(out.length < n){
    let added = false;
    keys.forEach(k => {
      const have = out.filter(x => group(x.kind) === k).length;
      if(have < mix[k] && buckets[k] && buckets[k].length){ out.push(buckets[k].pop()); added = true; }
    });
    if(!added) break;
  }
  const picked = out.slice(0, n);
  // 把解釋題平均分佈（例如 20 題 5 題解釋 → 每第 4 題一題解釋）
  const defs = picked.filter(x => group(x.kind) === "def");
  const others = picked.filter(x => group(x.kind) !== "def");
  if(defs.length && others.length){
    const gap = Math.max(2, Math.round(picked.length / defs.length));
    const res = []; let di = 0;
    for(let i = 0; i < picked.length; i++){
      if(di < defs.length && (i + 1) % gap === 0){ res.push(defs[di++]); }
      else if(others.length){ res.push(others.shift()); }
      else { res.push(defs[di++]); }
    }
    return res.filter(Boolean).slice(0, n);
  }
  return picked;
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } }
function render(){
  const q = list[idx];
  $("qMeta").textContent = `第 ${idx+1} / ${list.length} 題`;
  $("qStars").textContent = "⭐".repeat(Math.min(5, right));
  $("qBar").style.width = (idx/list.length*100) + "%";
  $("qTag").textContent = q.tag || "";
  $("qText").textContent = q.q;
  $("qFb").style.display = "none"; $("qFb").className = "fb";
  $("nextBtn").classList.add("hide");
  const box = $("qChoices"); box.innerHTML = "";
  const opts = q.a.map((t,i)=>({t,i})); shuffle(opts);
  opts.forEach(o=>{
    const b = document.createElement("div"); b.className = "choice"; b.textContent = o.t;
    b.onclick = () => answer(b, o.i); box.appendChild(b);
  });
}
function answer(el, i){
  const q = list[idx], d = u(), ok = (i === q.k);
  [...$("qChoices").children].forEach(c => c.onclick = null);
  if(ok){
    el.classList.add("ok"); d.stars++; d.right++; right++;
    streak++; d.streak = streak;
    if(streak > (d.best || 0)) d.best = streak;
    newMedal = null;
    MEDALS.forEach(m => { if(streak === m.need && !(d.medals||[]).includes(m.key)){
      d.medals = d.medals || []; d.medals.push(m.key); newMedal = m; } });
    $("streak").textContent = "🔥 " + streak;
    $("qFb").style.display="block"; $("qFb").className="fb ok"; $("qFb").textContent = "✅ " + q.why + (newMedal ? "　🎖 新獎章：" + newMedal.emoji + " " + newMedal.name : "");
    if(newMedal) beep(1180);
    d.wrong = d.wrong.filter(w => w.q !== q.q); beep(880);
  } else {
    el.classList.add("bad");
    streak = 0; d.streak = 0; $("streak").textContent = "🔥 0";
    [...$("qChoices").children].forEach(c => { if(c.textContent === q.a[q.k]) c.classList.add("ok"); });
    $("qFb").style.display="block"; $("qFb").className="fb bad"; $("qFb").textContent = "💡 " + q.why;
    if(!d.wrong.find(w => w.q === q.q)) d.wrong.push(q);
    beep(220);
  }
  d.done++; save();
  $("nextBtn").classList.remove("hide");
}
$("nextBtn").onclick = () => { if(idx < list.length-1){ idx++; render(); } else finish(); };
function finish(){
  $("qBar").style.width = "100%";
  const d = u(), all = right === list.length;
  d.log = d.log || [];
  d.log.push({mode, label: LABEL[mode], emoji: EMOJI[mode], right, total: list.length,
              date: new Date().toLocaleDateString("zh-HK")});
  save(); refresh();
  $("doneEmoji").textContent = all ? "🏆" : "🎉";
  $("doneTitle").textContent = all ? "全對！太犀利啦！" : "做完啦！";
  $("doneSub").textContent = `${LABEL[mode]}：答對 ${right} / ${list.length} 題　🔥 本輪最長 ${streakBest()} 連勝`;
  $("doneStars").textContent = "⭐".repeat(Math.max(1, Math.round(right/list.length*5)));
  $("sheet").textContent = `${S.name}｜${LABEL[mode]}｜${right}/${list.length}｜${new Date().toLocaleDateString("zh-HK")}`;
  show("done");
}
$("report").onclick = async () => {
  const txt = $("sheet").textContent + "（詞語遊樂場・小五中文）";
  try{ if(navigator.share){ await navigator.share({text: txt}); return; } }catch(e){}
  try{ await navigator.clipboard.writeText(txt); toast("已複製，貼去 WhatsApp 就得 👍"); }
  catch(e){ toast(txt); }
};
$("again").onclick = () => start(mode);
$("back").onclick = () => { show("home"); refresh(); };
$("quit").onclick = () => { show("home"); refresh(); };
document.querySelectorAll(".task").forEach(b => b.onclick = () => start(b.dataset.mode));

let ac = null;
function beep(f){
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f; o.type = "sine"; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.08, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.16);
    o.start(); o.stop(ac.currentTime+.17);
  }catch(e){}
}
